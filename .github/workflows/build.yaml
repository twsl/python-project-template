name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        answers_variant: ["uv", "poetry"]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Test
        run: uv run copier copy ./ ./dist --data-file "./.github/assets/.copier-answers-${{ matrix.answers_variant }}.yml" -f --vcs-ref=HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: copier-results-${{ runner.os }}-${{ matrix.answers_variant }}
          path: ./dist/**/*
          include-hidden-files: true
        if: ${{ always() }}
